<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quero conhecer o colégio · EduGest</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A2744'/%3E%3Cpath d='M16 7 4 13l12 6 12-6z' fill='%23F59E0B'/%3E%3Cpath d='M9 16v5c0 2 3.5 4 7 4s7-2 7-4v-5l-7 3.5z' fill='%23F59E0B' opacity='.85'/%3E%3C/svg%3E">
<style>
  :root { --navy: #1A2744; --amber: #F59E0B; --amber-d: #D97706; --bg: #F1F5F9; --card: #fff; --text: #1E293B; --text2: #64748B; --muted: #94A3B8;
    --border: #E2E8F0; --erro: #991B1B; --errobg: #FEE2E2; --ok: #065F46; --okbg: #D1FAE5; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 10%, rgba(245, 158, 11, .12), transparent 40%), var(--bg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); display: flex; justify-content: center; padding: 28px 16px; }
  main { width: 100%; max-width: 560px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 26px 24px; box-shadow: 0 8px 24px rgba(15, 23, 42, .06); }
  .escola { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .escola img { max-width: 96px; max-height: 64px; object-fit: contain; }
  .escola strong { font-size: 17px; color: var(--navy); }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; color: var(--navy); }
  p.sub { margin: 0 0 20px; color: var(--text2); font-size: 14.5px; line-height: 1.55; }
  .grupo { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin: 18px 0 10px; }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo { margin-bottom: 12px; }
  label.r { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  label.r span { color: var(--amber-d); }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; font: inherit; font-size: 15px; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); }
  .aceite { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--text2); margin: 16px 0 18px; cursor: pointer; }
  .aceite input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--amber-d); }
  .isca { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  button { width: 100%; padding: 13px 18px; border: 0; border-radius: 10px; background: var(--amber); color: var(--navy); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .erro { background: var(--errobg); color: var(--erro); border-radius: 9px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  .ok { text-align: center; padding: 18px 4px; }
  .ok .icone { width: 60px; height: 60px; border-radius: 50%; background: var(--okbg); color: var(--ok); font-size: 30px; line-height: 60px; margin: 0 auto 14px; }
  .ok h2 { margin: 0 0 8px; color: var(--navy); font-size: 20px; }
  .ok p { margin: 0; color: var(--text2); line-height: 1.55; }
  .carregando { text-align: center; color: var(--text2); padding: 30px 0; }
  footer { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
  @media (max-width: 480px) { .linha { grid-template-columns: 1fr; } .card { padding: 22px 18px; } }
</style>
</head>
<body>
<main>
  <div class="card" id="card"><div class="carregando">Carregando…</div></div>
  <footer>EduGest · Reis Tecnologia · <a href="privacidade.html" target="_blank" rel="noopener" style="color:inherit">Privacidade</a></footer>
</main>
<script>
(function () {
  'use strict';
  var card = document.getElementById('card');
  var token = new URLSearchParams(location.search).get('c') || '';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var opcoes = function (lista, vazio) { return (vazio ? '<option value="">' + vazio + '</option>' : '') + lista.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); };

  function mascaraTelefone(el) {
    var d = el.value.replace(/\D/g, '').slice(0, 11);
    if (d.length > 10) d = d.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
    else if (d.length > 6) d = d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
    else if (d.length > 2) d = d.replace(/(\d{2})(\d{0,5})/, '($1) $2');
    el.value = d;
  }

  function indisponivel(msg) {
    card.innerHTML = '<div class="ok"><div class="icone" style="background:#FEF3C7;color:#92400E">!</div><h2>Formulário indisponível</h2><p>' + esc(msg) + '</p></div>';
  }

  function montar(c) {
    document.title = c.titulo + ' · ' + c.colegio;
    var turnos = Object.keys(c.turnos).map(function (k) { return '<option value="' + k + '">' + esc(c.turnos[k]) + '</option>'; }).join('');
    card.innerHTML =
      '<div class="escola">' + (c.logo ? '<img src="' + c.logo + '" alt="">' : '') + '<strong>' + esc(c.colegio) + '</strong></div>'
      + '<h1>' + esc(c.titulo) + '</h1><p class="sub">' + esc(c.mensagem) + '</p>'
      + '<form id="form" novalidate autocomplete="on"><div id="erro"></div>'
      + '<div class="grupo">Aluno(a)</div>'
      + '<div class="campo"><label class="r" for="nomeAluno">Nome do(a) aluno(a) <span>*</span></label><input id="nomeAluno" name="nomeAluno" maxlength="100" required autocomplete="off"></div>'
      + '<div class="linha"><div class="campo"><label class="r" for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento" type="date"></div>'
      + '<div class="campo"><label class="r" for="serie">Série pretendida</label><select id="serie" name="serie">' + opcoes(c.series, 'Escolha') + '</select></div></div>'
      + '<div class="linha"><div class="campo"><label class="r" for="ano">Ano letivo</label><select id="ano" name="ano">' + c.anos.map(function (a, i) { return '<option' + (i === 1 ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div>'
      + '<div class="campo"><label class="r" for="turno">Turno preferido</label><select id="turno" name="turno"><option value="">Sem preferência</option>' + turnos + '</select></div></div>'
      + '<div class="grupo">Responsável</div>'
      + '<div class="campo"><label class="r" for="responsavel">Seu nome <span>*</span></label><input id="responsavel" name="responsavel" maxlength="100" required autocomplete="name"></div>'
      + '<div class="linha"><div class="campo"><label class="r" for="telefone">Telefone / WhatsApp <span>*</span></label><input id="telefone" name="telefone" inputmode="tel" maxlength="15" required autocomplete="tel" placeholder="(11) 99999-9999"></div>'
      + '<div class="campo"><label class="r" for="email">E-mail</label><input id="email" name="email" type="email" maxlength="160" autocomplete="email"></div></div>'
      + '<div class="campo"><label class="r" for="origem">Como conheceu o colégio?</label><select id="origem" name="origem">' + opcoes(c.origens, 'Escolha') + '</select></div>'
      + '<div class="campo"><label class="r" for="mensagem">Mensagem (opcional)</label><textarea id="mensagem" name="mensagem" rows="3" maxlength="500" placeholder="Dúvidas, melhor horário para contato…"></textarea></div>'
      + '<div class="isca" aria-hidden="true"><label for="site">Não preencha este campo</label><input id="site" name="site" tabindex="-1" autocomplete="off"></div>'
      + '<label class="aceite"><input type="checkbox" id="consentimento"> <span>Autorizo o ' + esc(c.colegio) + ' a entrar em contato comigo por telefone, WhatsApp ou e-mail sobre a matrícula. Meus dados serão usados só para isso.</span></label>'
      + '<button type="submit" id="enviar">Quero ser contatado(a)</button></form>';
    if (c.anos.length < 2) document.getElementById('ano').selectedIndex = 0;
    document.getElementById('telefone').addEventListener('input', function (e) { mascaraTelefone(e.target); });
    document.getElementById('form').addEventListener('submit', enviar);
  }

  function erro(msg) {
    var e = document.getElementById('erro');
    e.innerHTML = msg ? '<div class="erro">' + esc(msg) + '</div>' : '';
    if (msg) e.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function enviar(ev) {
    ev.preventDefault();
    var f = ev.target;
    var val = function (n) { return (f.elements[n].value || '').trim(); };
    if (val('nomeAluno').length < 3) return erro('Informe o nome completo do(a) aluno(a).');
    if (val('responsavel').length < 3) return erro('Informe o seu nome.');
    if (val('telefone').replace(/\D/g, '').length < 10) return erro('Informe um telefone com DDD.');
    if (!document.getElementById('consentimento').checked) return erro('Para enviar, autorize o colégio a entrar em contato.');
    erro('');
    var botao = document.getElementById('enviar');
    botao.disabled = true; botao.textContent = 'Enviando…';
    var corpo = { nomeAluno: val('nomeAluno'), nascimento: val('nascimento') || null, serie: val('serie') || null, ano: val('ano') ? Number(val('ano')) : null,
      turno: val('turno') || null, responsavel: val('responsavel'), telefone: val('telefone'), email: val('email') || null, origem: val('origem') || null,
      mensagem: val('mensagem') || null, site: val('site'), consentimento: true };
    fetch('/api/publico/funil/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (x) {
        if (x.status === 201) {
          card.innerHTML = '<div class="ok"><div class="icone">✓</div><h2>Recebemos o seu interesse!</h2><p>Obrigado, ' + esc(corpo.responsavel.split(' ')[0])
            + '. A equipe do colégio vai entrar em contato pelo telefone informado' + (corpo.email ? ' ou por e-mail' : '') + '.</p></div>';
          return;
        }
        erro(x.d.erro || (x.status === 429 ? 'Muitos envios seguidos. Aguarde alguns minutos.' : 'Não foi possível enviar. Tente de novo.'));
        botao.disabled = false; botao.textContent = 'Quero ser contatado(a)';
      })
      .catch(function () { erro('Sem conexão. Verifique a internet e tente de novo.'); botao.disabled = false; botao.textContent = 'Quero ser contatado(a)'; });
  }

  if (!/^[A-Za-z0-9_-]{16}$/.test(token)) { indisponivel('O link está incompleto. Peça ao colégio o endereço correto.'); return; }
  fetch('/api/publico/funil/' + encodeURIComponent(token), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (x) { if (x.status === 200) montar(x.d); else indisponivel(x.d.erro || 'Fale diretamente com o colégio.'); })
    .catch(function () { indisponivel('Sem conexão. Verifique a internet e tente de novo.'); });
})();
</script>
</body>
</html>
