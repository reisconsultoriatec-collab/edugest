<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduGest — Gestão Educacional</title>
<meta name="description" content="EduGest — Gestão Educacional Multi-Colégio · Reis Tecnologia">
<meta name="theme-color" content="#1A2744">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/app.css?v=1.19.0">
</head>
<body>

<!-- Carregando (tela cheia com a marca) -->
<div id="carregando" class="carregando fundo-caderno aberto" role="status" aria-live="polite">
  <div class="carregando-caixa">
    <div class="carregando-marca">
      <svg class="carregando-anel" viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="46"/><circle class="arco" cx="50" cy="50" r="46"/></svg>
      <span class="marca clara grande" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 7 4 13l12 6 12-6z" fill="#F59E0B"/><path d="M9 16v5c0 2 3.5 4 7 4s7-2 7-4v-5l-7 3.5z" fill="#F59E0B" opacity=".85"/><path d="M26.5 14v6.2" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    </div>
    <strong class="carregando-nome">EduGest</strong>
    <span id="carregandoMsg">Carregando...</span>
    <div class="carregando-barra indeterminada" id="carregandoBarra"><span></span></div>
  </div>
</div>

<!-- Telas de acesso (login, cadastro, pendente...) -->
<main id="telaAuth" class="tela-auth fundo-caderno" hidden></main>

<!-- Aplicação -->
<div id="app" class="app" hidden>
  <div class="sidebar-fundo" data-action="menu-fechar"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-topo">
      <div class="logo"><span class="marca clara" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 7 4 13l12 6 12-6z" fill="#F59E0B"/><path d="M9 16v5c0 2 3.5 4 7 4s7-2 7-4v-5l-7 3.5z" fill="#F59E0B" opacity=".85"/><path d="M26.5 14v6.2" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/></svg></span> EduGest</div>
      <div class="logo-sub">Gestão Educacional</div>
    </div>
    <div class="sidebar-colegio">
      <label class="rotulo-claro" for="seletorColegio">Colégio</label>
      <select id="seletorColegio" class="select-escuro"></select>
    </div>
    <nav class="sidebar-nav" id="menu"></nav>
    <div class="sidebar-rodape">Reis Tecnologia</div>
  </aside>

  <div class="principal">
    <header class="topo">
      <button class="btn-menu" data-action="menu-abrir" aria-label="Abrir menu"><i class="ti ti-menu-2"></i></button>
      <h1 class="topo-titulo" id="titulo">Dashboard</h1>
      <div class="topo-direita">
        <button class="status-conexao" id="statusConexao" type="button" data-action="status-conexao" hidden>
          <span class="ponto" aria-hidden="true"></span><span class="status-texto"></span>
        </button>
        <button class="btn-redondo" data-action="atualizar-tela" title="Atualizar esta tela" aria-label="Atualizar esta tela"><i class="ti ti-refresh"></i></button>
        <button class="btn-redondo" data-action="tema" title="Tema claro/escuro"><i class="ti ti-moon" id="iconeTema"></i></button>
        <div class="usuario-menu">
          <button class="usuario-botao" data-action="menu-usuario">
            <span class="avatar" id="avatar">?</span>
            <span class="usuario-info"><strong id="usuarioNome">—</strong><small id="usuarioPerfil">—</small></span>
            <i class="ti ti-chevron-down seta-usuario"></i>
          </button>
          <div class="usuario-dropdown" id="usuarioDropdown" hidden>
            <button data-action="tema" class="so-celular"><i class="ti ti-contrast-2"></i> Tema claro/escuro</button>
            <button data-action="recarregar-sistema"><i class="ti ti-reload"></i> Recarregar o sistema</button>
            <button data-action="sair"><i class="ti ti-logout"></i> Sair</button>
          </div>
        </div>
      </div>
      <div class="progresso-topo" id="progressoTopo" aria-hidden="true"></div>
    </header>
    <section class="conteudo" id="conteudo"></section>
  </div>
</div>

<!-- Camadas de modal e toast -->
<div id="modais"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div class="aviso-versao" id="avisoVersao" role="status" hidden>
  <i class="ti ti-sparkles" aria-hidden="true"></i>
  <span>Há uma nova versão do EduGest.</span>
  <button class="btn btn-primario" data-action="versao-atualizar"><i class="ti ti-refresh"></i> Atualizar agora</button>
  <button class="aviso-versao-fechar" data-action="versao-depois" title="Lembrar depois" aria-label="Lembrar depois"><i class="ti ti-x"></i></button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>EG.iniciar();</script>
</body>
</html>
